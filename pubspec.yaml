name: refindutem
description: "ReFind UTeM helps verified campus users report, browse, and resolve lost and found items."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.1 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  crop_your_image: ^2.0.0
  cupertino_icons: ^1.0.9
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^17.2.3
  google_fonts: ^8.1.0
  flutter_dotenv: ^6.0.0
  intl: ^0.20.2
  provider: ^6.1.5+1
  supabase_flutter: ^2.12.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/config/
